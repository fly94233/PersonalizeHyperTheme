name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 注意: secrets 上下文不能用在 if 条件里 (GitHub 会报 Unrecognized named-value: 'secrets',
    # 2026-11-19 首次运行即因此 startup_failure), 所以先把 secret 映射到 job 级 env, 再用 env 判断
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-sdk-file: ~/android-sdk

      - name: Build Debug APK (for testing)
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/signing.keystore
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/signing.keystore --ks-key-alias "$SIGNING_KEY_ALIAS" --ks-pass "pass:$SIGNING_KEYSTORE_PASSWORD" --key-pass "pass:$SIGNING_KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true app/build/outputs/apk/release/*.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk
          rm -f /tmp/signing.keystore

      - name: Warn if signing was skipped
        if: ${{ env.SIGNING_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::SIGNING_KEYSTORE_BASE64 is not set - the Release APK is UNSIGNED and cannot be installed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/PersonalizeHyperTheme-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/PersonalizeHyperTheme-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## 更新内容
            - Jetpack Compose 现代化界面
            - 系统快捷操作：重启桌面 / 智能助理 / 主题
            - 状态栏 edge-to-edge 融合 + 底部社交图标
            - 检查更新功能
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
